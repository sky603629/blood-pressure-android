plugins {
    id "com.android.application"
}

android {
    namespace "com.pressurediary.app"
    compileSdk 33
    buildToolsVersion "33.0.0"

    defaultConfig {
        applicationId "com.pressurediary.app"
        minSdk 23
        targetSdk 32
        versionCode 5
        versionName "1.2.1"
    }
}

dependencies {
    // The seven-segment model is bundled in assets/tessdata, not downloaded at runtime.
    implementation 'cz.adaptech.tesseract4android:tesseract4android:4.9.0'
    implementation 'androidx.core:core:1.9.0'
    implementation 'androidx.exifinterface:exifinterface:1.3.6'
}
